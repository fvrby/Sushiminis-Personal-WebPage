<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Sushiminis</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Titillium+Web' rel='stylesheet' type='text/css'>
</head>
<body>
    <div class="chat-window">
        <div class="chat-header">
            <img src="../../Assets/icons/Windows Messenger.png" alt="Chat Icon" class="header-icon">
            <span class="header-text">SUSHIMINIS CHAT</span>
        </div>
        
        <div class="chat-content">
            <div class="welcome-message">
                <h2>💬 Welcome to the Chat!</h2>
                <p>
                    Feel free to leave a message, say hi, or just chat with other visitors. 
                    This is a space for everyone who wants to share something with me or with the community.
                </p>
                <p class="chat-note">
                    <strong>Note:</strong> Be respectful and kind. This is a safe space for everyone. 🌟
                </p>
            </div>
            
            <div class="chat-container">
                <iframe src="https://www3.cbox.ws/box/?boxid=3541378&boxtag=sQaouL" 
                        allowtransparency="yes" 
                        allow="autoplay" 
                        frameborder="0" 
                        scrolling="auto">
                </iframe>
            </div>
        </div>
    </div>
</body>
</html>
