<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushiminis Zone</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div class="crt-effect">
        <div class="window-xp">
            <div class="window-header">
                <div class="window-title">
                    <img src="https://i.imgur.com/tDL2M4d.png" alt="Windows Icon" class="window-icon">
                    <span>Welcome to Sushiminis</span>
                </div>
                <div class="window-controls">
                    <div class="window-button window-minimize">_</div>
                    <div class="window-button window-maximize">□</div>
                    <div class="window-button window-close">×</div>
                </div>
            </div>
            <div class="window-content">
                <div class="xp-icons">
                    <img src="Assets/Gifs/cinnamo.gif" alt="Cinnamo GIF" class="xp-icon">
                </div>
                <h1 class="welcome-text">Welcome</h1>
                <p class="welcome-subtitle">Where are you visiting from?<span class="xp-cursor"></span></p>
                <div class="xp-button-container">
                    <a href="Pages/desktop.html?view=mobile" class="xp-button">MOBILE</a>
                    <a href="Pages/desktop.html?view=desktop" class="xp-button">DESKTOP</a>
                </div>
                <p class="construction-note">page under construction, please be patient</p>
            </div>
        </div>
        <div class="dog-container">
            <img src="Assets/Gifs/Dog.gif" alt="Dog" class="dog-gif">
        </div>
    </div>
    <script src="src/script.js"></script>
</body>
</html>
